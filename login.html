<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Daftar - TEMUKAN</title>
    
    <!-- Font Awesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS KHUSUS UNTUK HALAMAN LOGIN -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0eaff 0%, #f4f7fb 100%);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
        }

        .login-box h2 {
            text-align: center;
            color: #1a56db;
            margin-bottom: 25px;
            font-weight: 800;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
        }

        .tabs button {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 800;
            color: #64748b;
            font-size: 15px;
            transition: 0.3s;
        }

        .tabs button.active {
            color: #1a56db;
            border-bottom: 3px solid #1a56db;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 13px;
            color: #475569;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            background-color: #f8fafc;
        }

        .input-group input:focus {
            border-color: #1a56db;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        .btn-kirim {
            width: 100%;
            background-color: #1a56db;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-kirim:hover {
            background-color: #1545a8;
            transform: translateY(-2px);
        }

        .btn-kirim.green {
            background-color: #10b981;
        }
        .btn-kirim.green:hover {
            background-color: #059669;
        }

        .error-msg {
            color: #dc2626;
            font-size: 13px;
            margin-top: 15px;
            text-align: center;
            font-weight: 700;
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-back:hover { 
            color: #1a56db; 
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2><i class="fa-solid fa-magnifying-glass"></i> TEMUKAN</h2>
        
        <!-- Tab Menu -->
        <div class="tabs">
            <button class="active" onclick="switchTab('login')">Masuk</button>
            <button onclick="switchTab('register')">Daftar</button>
        </div>

        <!-- Form Login -->
        <div id="formLoginBox" class="form-container active">
            <form id="formLogin">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required placeholder="Masukkan email">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="Masukkan password">
                </div>
                <button type="submit" class="btn-kirim">Masuk</button>
                <div id="loginError" class="error-msg"></div>
            </form>
        </div>

        <!-- Form Daftar -->
        <div id="formRegisterBox" class="form-container">
            <form id="formRegister">
                <div class="input-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="regName" required placeholder="Nama Anda">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required placeholder="email@sekolah.com">
                </div>
                <div class="input-group">
                    <label>Password (Min. 6 Karakter)</label>
                    <input type="password" id="regPassword" required placeholder="Buat password">
                </div>
                <button type="submit" class="btn-kirim green">Daftar Sekarang</button>
                <div id="regError" class="error-msg"></div>
            </form>
        </div>

        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
    </div>

    <!-- Script Logika Firebase (Sama seperti sebelumnya) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyB6wbESXwG1x43GCNUTyfYQ-X5KksiLnzE",
  authDomain: "temukan-app-20b29.firebaseapp.com",
  projectId: "temukan-app-20b29",
  storageBucket: "temukan-app-20b29.firebasestorage.app",
  messagingSenderId: "964187120219",
  appId: "1:964187120219:web:3e62624f73ac896fd5957e"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.switchTab = (tab) => {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.tabs button')[0].classList.add('active');
                document.getElementById('formLoginBox').classList.add('active');
            } else {
                document.querySelectorAll('.tabs button')[1].classList.add('active');
                document.getElementById('formRegisterBox').classList.add('active');
            }
        };

        document.getElementById('formLogin').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const errDiv = document.getElementById('loginError');

            signInWithEmailAndPassword(auth, email, pass)
                .then((user) => {
                    localStorage.setItem('userEmail', user.user.email); 
                    window.location.href = 'index.html'; 
                })
                .catch((error) => {
                    errDiv.innerText = "Email atau Password salah!";
                });
        });

        document.getElementById('formRegister').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPassword').value;
            const errDiv = document.getElementById('regError');

            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", userCred.user.uid), {
                    nama: name,
                    email: email,
                    role: "anggota"
                });

                alert('Pendaftaran berhasil! Silakan login.');
                switchTab('login');
                document.getElementById('formRegister').reset();
            } catch (error) {
                errDiv.innerText = "Gagal daftar: " + error.message;
            }
        });
    </script>
</body>
</html>
